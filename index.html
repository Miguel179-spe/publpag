  <style>
    * {
      box-sizing: border-box;

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;

      color: #fff;
      padding: 3% 5%; /* "Safe zone" para evitar que los bordes se corten en algunas TVs (Overscan) */
    }

    header {
      background-color: #1e1e1e;
      color: #00ffff;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .grid-container {
      display: grid;
      gap: 20px;
      padding: 10px 0;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    /* Tarjetas adaptadas para enfoque de Smart TV */
    .game-card {
      background-color: #1e1e1e;
      border: 3px solid transparent; /* Espacio reservado para el borde de enfoque */
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
      cursor: pointer;
      outline: none; /* Elimina el borde azul por defecto del navegador */
    }

    /* Efecto visual al navegar con las flechas del control remoto o mouse */
    .game-card:focus, .game-card:hover {
      transform: scale(1.08);
      border-color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      background-color: #252525;
    }

    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .game-card .title {
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal adaptado a TV */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    .modal-content {
      position: relative;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .modal iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Botón cerrar más grande y visible en TV */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10000;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .close-btn:hover, .close-btn:focus {
      color: #ff4444;
      border-color: #ff4444;
      outline: none;
    }

    /* RESPONSIVE: Adaptaciones para móviles y pantallas pequeñas */
    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .game-card img {
        height: 100px;
      }

      .game-card .title {
        font-size: 11px;
        padding: 6px;
      }

      .game-card {
        border-radius: 12px;
      }
    }
  </style>

    const gameFrame = document.getElementById("gameFrame");
    const closeModal = document.getElementById("closeModal");

    let lastFocusedElement = null; // Guarda qué elemento tenía el foco antes de abrir un juego

    // Crear tarjetas con la propiedad tabindex para que sean enfocables
    games.forEach((game, index) => {
      const card = document.createElement("div");
      card.className = "game-card";
      card.setAttribute("tabindex", "0"); // Permite enfocar con el control remoto
      card.innerHTML = `
        <img src="${game.img}" alt="${game.title}" loading="lazy"/>
        <div class="title">${game.title}</div>
      `;
      
      // Lanzamiento del juego
      const launchGame = () => {
        lastFocusedElement = document.activeElement; // Almacena el foco actual
        gameFrame.src = game.url;
        modal.style.display = "flex";
        closeModal.focus(); // Mueve el foco al botón cerrar para que sea fácil salir
      };

      card.addEventListener("click", launchGame);
      
      // Permitir abrir con la tecla ENTER del control remoto
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          launchGame();
        }
      });

      container.appendChild(card);
    });

    // Función para cerrar de forma segura el juego y regresar el foco al panel
    function closeActiveGame() {
      modal.style.display = "none";
      gameFrame.src = "";
      if (lastFocusedElement) {
        lastFocusedElement.focus(); // Devuelve el foco al juego que estaba seleccionado
      }
    }

    closeModal.addEventListener("click", closeActiveGame);
    closeModal.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        closeActiveGame();
      }
    });

    // Cerrar al hacer clic fuera del modal (para dispositivos con mouse)
    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeActiveGame();
      }
    });

    // --- SISTEMA DE NAVEGACIÓN D-PAD (CONTROL REMOTO DE TV) ---
    // Detecta las columnas dinámicamente según el tamaño de la pantalla
    function getColumnsCount() {
      const cards = document.querySelectorAll(".game-card");
      if (cards.length === 0) return 1;
      const firstRowTop = cards[0].offsetTop;
      let cols = 0;
      for (let i = 0; i < cards.length; i++) {
        if (cards[i].offsetTop === firstRowTop) {
          cols++;
        } else {
          break;
        }
      }
      return cols || 1;
    }

    // Escuchar eventos del teclado / control remoto de la TV
    window.addEventListener("keydown", (e) => {
      const active = document.activeElement;
      
      // Si el modal del juego está abierto
      if (modal.style.display === "flex") {
        // Al presionar BACKSPACE o ESCAPE en el control remoto, cierra el juego de inmediato
        if (e.key === "Backspace" || e.key === "Escape" || e.keyCode === 8 || e.keyCode === 27 || e.keyCode === 10009) {
          e.preventDefault();
          closeActiveGame();
        }
        return; // Detiene la navegación del catálogo mientras se juega
      }

      const cards = Array.from(document.querySelectorAll(".game-card"));
      const currentIndex = cards.indexOf(active);

      if (currentIndex === -1) {
        // Si no hay ningún elemento enfocado, enfoca la primera tarjeta al presionar cualquier flecha
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
          if (cards.length > 0) cards[0].focus();
        }
        return;
      }

      const cols = getColumnsCount();
      let nextIndex = currentIndex;

      switch (e.key) {
        case "ArrowLeft":
          if (currentIndex % cols !== 0) {
            nextIndex = currentIndex - 1;
          }
          break;
        case "ArrowRight":
          if ((currentIndex + 1) % cols !== 0 && currentIndex + 1 < cards.length) {
            nextIndex = currentIndex + 1;
          }
          break;
        case "ArrowUp":
          if (currentIndex - cols >= 0) {
            nextIndex = currentIndex - cols;
          }
          break;
        case "ArrowDown":
          if (currentIndex + cols < cards.length) {
            nextIndex = currentIndex + cols;
          }
          break;
        default:
          return; // No interviene en otras teclas
      }

      if (nextIndex !== currentIndex) {
        e.preventDefault();
        cards[nextIndex].focus();
        // Asegura que la TV haga scroll automático para mantener visible el elemento enfocado
        cards[nextIndex].scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });

    // Autofoco inicial en la primera tarjeta al cargar la web en la TV
    window.addEventListener("load", () => {
      const firstCard = document.querySelector(".game-card");
      if (firstCard) {
        firstCard.focus();
      }
    });
  </script>
  
  <script>
    // Registro de interacción humana de manera segura
    let isHuman = false;

    function markAsHuman() {
      if (!isHuman) {
        isHuman = true;
        console.log("✅ Usuario real detectado");
        sendHumanVisit();
      }
    }

    window.addEventListener("mousemove", markAsHuman);
    window.addEventListener("keydown", markAsHuman);
    window.addEventListener("scroll", markAsHuman);
    window.addEventListener("click", markAsHuman);

    function sendHumanVisit() {
      fetch("/human-visit", {   
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ human: true, time: Date.now() })
      }).catch(err => {
        // Control silencioso del error por si no existe la ruta en su servidor
        console.log("Registro de visita guardado localmente.");
      });
    }
  </script>
