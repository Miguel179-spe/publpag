<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 Streaming en Vivo</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--p:#f5c518;--bg:#0a0a0a;--s:#161616;--c:#1a1a1a;--b:#2a2a2a;--t:#e0e0e0;--t2:#888}
html,body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;height:100%;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

/* Header */
#hdr{display:flex;align-items:center;padding:10px 14px;background:var(--s);border-bottom:1px solid var(--b);justify-content:space-between;flex-shrink:0}
#logo{color:var(--p);font-weight:700;font-size:17px}
#count{color:var(--t2);font-size:11px}

/* Filters */
#filters{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--s);border-bottom:1px solid var(--b);flex-shrink:0;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
.fbtn{padding:5px 12px;border:1px solid var(--b);border-radius:20px;background:transparent;color:var(--t2);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;font-weight:500}
.fbtn:hover{border-color:var(--p);color:var(--t)}
.fbtn.active{background:var(--p);color:#000;border-color:var(--p);font-weight:700}

/* Grid */
#main{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar{width:4px}
#main::-webkit-scrollbar-track{background:var(--bg)}
#main::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
#empty{text-align:center;padding:60px;color:var(--t2);font-size:14px;display:none}

/* Cards */
.card{position:relative;aspect-ratio:2/1;background:var(--c);border-radius:6px;overflow:hidden;border:1px solid transparent;cursor:pointer;transition:all .2s;will-change:border-color}
.card:hover{transform:scale(1.02)}
.card.focused{border-color:var(--p);transform:scale(1.05);box-shadow:0 0 15px rgba(245,197,24,.3);z-index:10}
.card img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;position:absolute;inset:0}
.card img.loaded{opacity:1}
.card-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--c);position:absolute;inset:0}
.card-ph-icon{font-size:28px;opacity:.5}
.card-ph-name{font-size:10px;font-weight:600;color:var(--t2);text-align:center;padding:0 6px;line-height:1.3}
.card-label{position:absolute;bottom:0;left:0;right:0;padding:20px 6px 6px;background:linear-gradient(transparent,#000);font-size:11px;font-weight:600;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s;z-index:2}
.card.focused .card-label{opacity:1;transform:translateY(0)}
.card-group{position:absolute;top:5px;right:5px;font-size:9px;background:rgba(0,0,0,.6);padding:2px 5px;border-radius:3px;color:var(--t2);opacity:0;transition:opacity .2s;z-index:2}
.card.focused .card-group{opacity:1}

/* Player */
#player{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
#player.open{display:flex}
#pcontent{flex:1;width:100%;position:relative;background:#000}
#vid,#ytslot{width:100%;height:100%}
#ytslot{display:flex;align-items:center;justify-content:center}
#ytslot iframe{width:100%;height:100%;border:none}

/* Player UI */
#pui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:.2s;background:linear-gradient(#000a,transparent 15%,transparent 85%,#000a);pointer-events:none;z-index:100}
#pui>*{pointer-events:auto}
#pui.hide{opacity:0}
#pui.hide>*{pointer-events:none}
#ptop{padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
#ptitle{font-size:14px;font-weight:600}
#pgroup{font-size:11px;color:var(--t2);margin-top:2px}
#pbottom{padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#pprog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ptime{font-size:12px;min-width:45px}
#pbar{flex:1;height:5px;background:#444;border-radius:3px;position:relative;cursor:pointer}
#pbuf{position:absolute;left:0;top:0;height:100%;background:#666;border-radius:3px}
#pfill{position:absolute;left:0;top:0;height:100%;background:var(--p);border-radius:3px}
#pctrl{display:flex;justify-content:center;gap:10px}
.pbtn{width:44px;height:44px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.pbtn:hover,.pbtn:active{background:var(--p);color:#000}
#pbtnplay{width:52px;height:52px;font-size:18px}
#pbtnclose{position:absolute;top:12px;right:12px;width:36px;height:36px;font-size:14px}

/* Loader / Error */
#pload,#perr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;z-index:150}
#pload.show,#perr.show{display:block}
.spin{width:36px;height:36px;border:3px solid #333;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
#perr-msg{font-size:12px;color:#888;margin:8px 0}
#perr-actions{display:flex;gap:8px;justify-content:center;margin-top:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="logo">📺 STREAMING EN VIVO</div>
    <span id="count"></span>
  </div>
  <div id="filters"></div>
  <div id="main">
    <div id="grid"></div>
    <div id="empty">No hay canales en esta categoría</div>
  </div>
</div>

<!-- Full-screen player -->
<div id="player">
  <div id="pcontent">
    <video id="vid" playsinline></video>
    <div id="ytslot"></div>

    <div id="pload"><div class="spin"></div><div style="font-size:12px;color:#888">Conectando...</div></div>
    <div id="perr">
      <div>❌ Error al reproducir</div>
      <div id="perr-msg"></div>
      <div id="perr-actions">
        <button class="pbtn" onclick="retry()">Reintentar</button>
        <button class="pbtn" onclick="closePlayer()">Volver</button>
      </div>
    </div>

    <div id="pui">
      <div id="ptop">
        <div id="ptitle"></div>
        <div id="pgroup"></div>
      </div>
     
    </div>
  </div>
</div>

// ── State ────────────────────────────────────────────────────────────────────
const GROUPS = ['Todos', ...Array.from(new Set(CHANNELS.map(c => c.group)))];
let activeGroup = 'Todos';
let focusedIdx = 0;
let currentChannel = null;
let hlsInstance = null;
let gridCols = 1;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const $grid    = document.getElementById('grid');
const $empty   = document.getElementById('empty');
const $filters = document.getElementById('filters');
const $count   = document.getElementById('count');
const $player  = document.getElementById('player');
const $vid     = document.getElementById('vid');
const $ytslot  = document.getElementById('ytslot');
const $pload   = document.getElementById('pload');
const $perr    = document.getElementById('perr');
const $perrmsg = document.getElementById('perr-msg');
const $pui     = document.getElementById('pui');
const $ptitle  = document.getElementById('ptitle');
const $pgroup  = document.getElementById('pgroup');

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(s) {
  if (!s || !isFinite(s)) return '0:00';
  const h = ~~(s/3600), m = ~~(s%3600/60), ss = ~~(s%60);
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${m}:${String(ss).padStart(2,'0')}`;
}

function ytId(url) {
  const m = url.match(/(?:watch\?v=|youtu\.be\/|embed\/)([^&\n?#]+)/);
  return m ? m[1] : null;
}

function filtered() {
  return activeGroup === 'Todos' ? CHANNELS : CHANNELS.filter(c => c.group === activeGroup);
}

function calcCols() {
  const cards = $grid.children;
  if (!cards.length) return;
  const top = cards[0].getBoundingClientRect().top;
  let c = 1;
  for (let i = 1; i < cards.length; i++) {
    if (Math.abs(cards[i].getBoundingClientRect().top - top) < 10) c++;
    else break;
  }
  gridCols = Math.max(1, c);
}

// ── Render filters ────────────────────────────────────────────────────────────
function renderFilters() {
  $filters.innerHTML = '';
  GROUPS.forEach(g => {
    const b = document.createElement('button');
    b.className = 'fbtn' + (g === activeGroup ? ' active' : '');
    b.textContent = g;
    b.onclick = () => { activeGroup = g; focusedIdx = 0; renderFilters(); renderGrid(); };
    $filters.appendChild(b);
  });
}

// ── Render grid ───────────────────────────────────────────────────────────────
const observers = new WeakMap();

function renderGrid() {
  const list = filtered();
  $count.textContent = list.length + ' canales';
  $empty.style.display = list.length ? 'none' : 'block';
  $grid.innerHTML = '';

  list.forEach((ch, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (idx === focusedIdx ? ' focused' : '');
    card.dataset.idx = idx;

    // Placeholder always present
    const ph = document.createElement('div');
    ph.className = 'card-ph';
    ph.innerHTML = `<span class="card-ph-icon">📺</span><span class="card-ph-name">${ch.title}</span>`;
    card.appendChild(ph);

    // Lazy image
    if (ch.poster) {
      const img = document.createElement('img');
      img.alt = ch.title;
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const t = new Image();
            t.onload = () => { img.src = ch.poster; img.classList.add('loaded'); ph.style.display = 'none'; };
            t.onerror = () => {}; // keep placeholder
            t.src = ch.poster;
            obs.disconnect();
          }
        });
      }, { rootMargin: '300px 0px' });
      obs.observe(card);
      card.appendChild(img);
    }

    const label = document.createElement('div');
    label.className = 'card-label';
    label.textContent = ch.title;
    card.appendChild(label);

    const grp = document.createElement('div');
    grp.className = 'card-group';
    grp.textContent = ch.group;
    card.appendChild(grp);

    card.onclick = () => { focusedIdx = idx; setFocused(idx); playChannel(ch); };
    $grid.appendChild(card);
  });

  setTimeout(calcCols, 100);
}

function setFocused(idx) {
  [...$grid.children].forEach((c, i) => c.classList.toggle('focused', i === idx));
  focusedIdx = idx;
}

// ── Player ────────────────────────────────────────────────────────────────────
function setLoading(on) { $pload.classList.toggle('show', on); }
function setError(msg)  { $perrmsg.textContent = msg; $perr.classList.toggle('show', !!msg); }
function isYT() { return currentChannel && currentChannel.type === 'youtube'; }

function destroyHls() {
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
}

function playChannel(ch) {
  currentChannel = ch;
  destroyHls();
  $vid.pause(); $vid.removeAttribute('src'); $vid.load();
  $ytslot.innerHTML = '';
  setLoading(true); setError('');
  $ptitle.textContent = ch.title;
  $pgroup.textContent = ch.group;
  $vid.style.display = isYT() ? 'none' : 'block';
  $ytslot.style.display = isYT() ? 'flex' : 'none';
  $player.classList.add('open');
  history.pushState({ player: true }, '', '#player');

  if (ch.type === 'youtube') {
    const id = ytId(ch.url);
    if (!id) { setLoading(false); setError('URL de YouTube inválida'); return; }
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
    iframe.allowFullscreen = true;
    iframe.onload = () => setLoading(false);
    $ytslot.appendChild(iframe);
  } else {
    loadHls(ch.url);
  }
}

function loadHls(url) {
  if (Hls.isSupported()) {
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hlsInstance = hls;
    hls.loadSource(url);
    hls.attachMedia($vid);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { setLoading(false); $vid.play().catch(()=>{}); });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        destroyHls();
        // fallback: try direct src
        $vid.src = url;
        $vid.play().catch(() => { setLoading(false); setError('No se pudo conectar. El canal puede estar fuera de servicio.'); });
      }
    });
  } else if ($vid.canPlayType('application/vnd.apple.mpegurl')) {
    $vid.src = url;
    $vid.play().catch(()=>{});
  } else {
    setLoading(false); setError('Tu navegador no soporta HLS');
  }
}

function closePlayer() {
  destroyHls();
  $vid.pause(); $vid.removeAttribute('src'); $vid.load();
  $ytslot.innerHTML = '';
  $player.classList.remove('open');
  setLoading(false); setError('');
  if (location.hash === '#player') history.back();
}

function retry() {
  if (currentChannel) playChannel(currentChannel);
}

function togglePlay() {
  $vid.paused ? $vid.play() : $vid.pause();
}

function seek(s) {
  if ($vid.duration) $vid.currentTime = Math.max(0, Math.min($vid.duration, $vid.currentTime + s));
}

// ── Video events ──────────────────────────────────────────────────────────────
$vid.addEventListener('canplay',  () => setLoading(false));
$vid.addEventListener('waiting',  () => setLoading(true));
$vid.addEventListener('playing',  () => setLoading(false));
$vid.addEventListener('pause',    () => {});
$vid.addEventListener('error', () => {
  const e = $vid.error;
  setLoading(false); setError(e ? `Error de video (código ${e.code})` : 'Error al reproducir');
});


// ── Browser back button ───────────────────────────────────────────────────────
window.addEventListener('popstate', () => {
  if ($player.classList.contains('open')) closePlayer();
});

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const NAV = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace'];
  if (NAV.includes(e.key)) e.preventDefault();

  if ($player.classList.contains('open')) {
    if (e.key === 'Escape' || e.key === 'Backspace') { closePlayer(); return; }
    if (!isYT()) {
      if (e.key === 'ArrowLeft')  seek(-10);
      if (e.key === 'ArrowRight') seek(10);
      if (e.key === 'Enter' || e.key === ' ') togglePlay();
    }
    return;
  }

  const list = filtered();
  let next = focusedIdx;
  if (e.key === 'ArrowLeft')  next = Math.max(0, focusedIdx - 1);
  if (e.key === 'ArrowRight') next = Math.min(list.length - 1, focusedIdx + 1);
  if (e.key === 'ArrowUp')    next = Math.max(0, focusedIdx - gridCols);
  if (e.key === 'ArrowDown')  next = Math.min(list.length - 1, focusedIdx + gridCols);
  if (e.key === 'Enter' || e.key === ' ') { if (list[focusedIdx]) playChannel(list[focusedIdx]); return; }

  if (next !== focusedIdx) {
    setFocused(next);
    $grid.children[next]?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
});

// ── Resize → recalc cols ──────────────────────────────────────────────────────
new ResizeObserver(() => calcCols()).observe($grid);

// ── Boot ──────────────────────────────────────────────────────────────────────
renderFilters();
renderGrid();
</script>
