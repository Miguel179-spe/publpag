<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona de Juegos HTML5</title>
  <style>
    /* Estilos estéticos de acuerdo a su panel (Oscuro con toques neón) */
    body {
      background-color: #071a24;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      margin-bottom: 30px;
    }

    /* Contenedor de la cuadrícula */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Estilo de las tarjetas de juego */
    .card {
      background-color: #0b1e28;
      border: 2px solid #005b66;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
      border-color: #00ffff;
    }

    /* Contenedor de imagen con relación de aspecto */
    .card-img-container {
      width: 100%;
      height: 150px;
      background-color: #000;
      position: relative;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
      text-align: center;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Pantalla completa para el juego (Iframe Overlay) */
    #game-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
    }

    /* Iframe que cargará el juego */
    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Botón flotante para cerrar el juego */
    #close-button {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: rgba(255, 0, 0, 0.85);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      transition: background-color 0.2s, transform 0.1s;
    }

    #close-button:hover {
      background-color: rgba(255, 0, 0, 1);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>ZONA DE JUEGOS</h1>

  <div class="grid-container" id="games-grid">
    <!-- Las tarjetas se generarán automáticamente aquí -->
  </div>

  <!-- Contenedor del Juego Activo -->
  <div id="game-overlay">
    <button id="close-button" onclick="closeGame()">VOLVER AL PANEL</button>
    <iframe id="game-frame" src="" allowfullscreen></iframe>
  </div>

  <script>
    // Su lista de juegos estructurada
    const gamesList = [
      {
        title: "Toy Car Gear",
        img: "https://images.gamepix.com/toy-car-gear/thumbnail/medium.png",
        url: "https://play.gamepix.com/toy-car-gear/embed" // Este enlace SÍ permite iframes
      },
      {
        title: "Classic Pacman",
        img: "https://images.gamepix.com/classic-pacman/thumbnail/medium.png",
        url: "https://play.gamepix.com/classic-pacman/embed"
      }
    ];

    const grid = document.getElementById('games-grid');
    const overlay = document.getElementById('game-overlay');
    const frame = document.getElementById('game-frame');

    // Renderizar las tarjetas de juegos en pantalla
    function init() {
      gamesList.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openGame(game.url);

        card.innerHTML = `
          <div class="card-img-container">
            <img src="${game.img}" alt="${game.title}" loading="lazy">
          </div>
          <div class="card-info">
            <p class="card-title">${game.title}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Abrir el juego seleccionado en el Iframe
    function openGame(url) {
      frame.src = url;
      overlay.style.display = 'block';
      document.body.style.overflow = 'hidden'; // Evita scroll de fondo
    }

    // Cerrar el juego y limpiar el Iframe
    function closeGame() {
      overlay.style.display = 'none';
      frame.src = ''; // Limpia el juego para que deje de sonar/consumir datos
      document.body.style.overflow = 'auto';
    }

    // Iniciar
    init();
  </script>
</body>
</html>
