<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Básico</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#fff;
}

header{
  padding:15px;
  text-align:center;
  background:#000;
  font-size:20px;
  font-weight:bold;
}

.search{
  padding:10px;
  text-align:center;
}

.search input{
  width:90%;
  padding:10px;
  border:none;
  border-radius:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
  padding:10px;
}

.card{
  background:#1c1c1c;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
  transition:0.2s;
}

.card:hover{
  background:#333;
}

.player{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#000;
  padding:10px;
  display:none;
}

video{
  width:100%;
  border-radius:10px;
}
</style>

</head>
<body>

<header>📺 Stream Básico</header>

<div class="search">
  <input type="text" id="search" placeholder="Buscar película...">
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
  <video id="video" controls></video>
</div>

<script src="app.js"></script>

</body>
</html>
