<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona Arcade Retro</title>
  <style>
    /* Estilo de la interfaz, alineado con el panel original del usuario */
    body {
      background-color: #071a24;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      margin-bottom: 30px;
    }

    /* Cuadrícula de juegos */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Tarjeta de juego */
    .card {
      background-color: #0b1e28;
      border: 2px solid #005b66;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      border-color: #00ffff;
    }

    .card-img-container {
      width: 100%;
      height: 200px;
      overflow: hidden;
      background-color: #000;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin: 0 0 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-console {
      font-size: 12px;
      color: #00ffff;
      text-transform: uppercase;
    }

    /* Contenedor del emulador a pantalla completa */
    #emulator-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
    }

    #emulator-player {
      width: 100%;
      height: 100%;
    }

    /* Botón para salir del juego */
    #close-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(255, 0, 0, 0.8);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      z-index: 10000;
      transition: background-color 0.2s;
    }

    #close-button:hover {
      background-color: rgba(255, 0, 0, 1);
    }
  </style>
</head>
<body>

  <h1>ZONA JUEGOS RETRO</h1>

  <div class="grid-container" id="games-grid">
    <!-- Las tarjetas se generarán dinámicamente aquí -->
  </div>

  <!-- Contenedor flotante para el Emulador -->
  <div id="emulator-overlay">
    <button id="close-button" onclick="closeGame()">CERRAR JUEGO</button>
    <div id="emulator-player"></div>
  </div>

  <script>
    const grid = document.getElementById('games-grid');
    const overlay = document.getElementById('emulator-overlay');
    const player = document.getElementById('emulator-player');

    // Cargar la lista de juegos desde el JSON
    fetch('games.json')
      .then(response => response.json())
      .then(games => {
        games.forEach(game => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => playGame(game.rom, game.consola);

          card.innerHTML = `
            <div class="card-img-container">
              <img src="${game.portada}" alt="${game.titulo}">
            </div>
            <div class="card-info">
              <p class="card-title">${game.titulo}</p>
              <span class="card-console">${game.consola_nombre}</span>
            </div>
          `;
          grid.appendChild(card);
        });
      })
      .catch(err => console.error("Error al cargar los juegos:", err));

    // Función para iniciar el juego usando EmulatorJS
    function playGame(romUrl, core) {
      // Limpiar contenedor previo
      player.innerHTML = '';
      overlay.style.display = 'block';

      // Definir las variables globales requeridas por EmulatorJS
      window.EJS_player = '#emulator-player';
      window.EJS_gameUrl = romUrl;
      window.EJS_core = core;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      
      // Ajustes opcionales de experiencia
      window.EJS_startOnLoaded = true;
      window.EJS_showStartButton = false;

      // Cargar dinámicamente el cargador de scripts del emulador
      const loader = document.createElement('script');
      loader.id = 'emulator-loader';
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
    }

    // Función para detener el juego y volver al panel
    function closeGame() {
      overlay.style.display = 'none';
      player.innerHTML = '';
      
      // Remover el script del cargador para poder reiniciarlo limpiamente en otro juego
      const loader = document.getElementById('emulator-loader');
      if (loader) {
        loader.remove();
      }
      
      // Limpiar las variables del objeto window
      delete window.EJS_player;
      delete window.EJS_gameUrl;
      delete window.EJS_core;
    }
  </script>
</body>
</html>
